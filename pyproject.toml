[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tabagent"
version = "0.1.0.dev0"
description = "Distill an LLM agent's closed-set decisions into cheap tabular classifiers: TabSchema, TabSynth, TabHead."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "The TabAgent Authors" }]
keywords = ["llm-agents", "tool-selection", "tabular-classification", "distillation", "catboost"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "catboost>=1.2",
  "pyyaml>=6.0",
]

[project.scripts]
tabagent = "tabagent.cli:main"

[project.optional-dependencies]
embed = ["torch>=2.1", "transformers>=4.40"]
tabschema = ["openai>=1.40"]
llm = ["litellm>=1.40"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7", "fastapi>=0.110", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/tabagent"]

[tool.hatch.build.targets.sdist]
include = ["src/tabagent", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: long-running regression tests (excluded from the default CI run)",
  "gpu: needs a CUDA GPU",
  "network: needs network access (dataset downloads, live LLM endpoints)",
]

[tool.ruff.lint.isort]
known-first-party = ["tabagent"]
known-local-folder = ["conftest"]
