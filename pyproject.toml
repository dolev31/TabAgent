[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "tabagent"
dynamic = ["version", "readme"]
description = "Distill an LLM agent's closed-set decisions into cheap tabular classifiers: TabSchema, TabSynth, TabHead."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
  { name = "Ido Levy" },
  { name = "Segev Shlomov" },
  { name = "Avi Yaeli" },
  { name = "Nir Mashkif" },
  { name = "Asaf Adi" },
  { name = "Yinon Goldstein" },
  { name = "Eilam Shapira" },
  { name = "Leshem Choshen" },
]
keywords = [
  "llm-agents", "tool-selection", "tool-shortlisting", "llm-routing", "skill-selection",
  "tabular-classification", "distillation", "agent-efficiency", "catboost",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "catboost>=1.2",
  "pyyaml>=6.0",
]

[project.scripts]
tabagent = "tabagent.cli:main"

[project.optional-dependencies]
embed = ["torch>=2.1", "transformers>=4.40"]
tabschema = ["openai>=1.40"]
llm = ["litellm>=1.40"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["tabagent[embed,tabschema,llm,serve]"]

[project.urls]
Homepage = "https://github.com/dolev31/TabAgent"
Source = "https://github.com/dolev31/TabAgent"
Documentation = "https://dolev31.github.io/TabAgent/"
Issues = "https://github.com/dolev31/TabAgent/issues"

[dependency-groups]
docs = ["mkdocs-material>=9.5"]
# Paper reproduction (experiments/): with the `embed` extra. GPU baselines need a CUDA build of torch.
repro = ["matplotlib>=3.7", "scipy>=1.10", "peft>=0.10", "threadpoolctl>=3.1", "packaging>=23"]
# Optional alternative heads for the head-ablation figure.
heads = ["xgboost>=2.0", "lightgbm>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7", "fastapi>=0.110", "httpx>=0.27"]

[tool.hatch.version]
path = "src/tabagent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tabagent"]

[tool.hatch.build.targets.sdist]
# Anchored paths: an unanchored "README.md" also matches experiments/*/README.md. experiments/ ships because
# tests/experiments imports it; docs/ (the site and its images), .github/ and uv.lock stay out.
include = [
  "/src/tabagent", "/tests", "/experiments", "/examples",
  "/README.md", "/LICENSE", "/NOTICE", "/CITATION.cff", "/pyproject.toml",
]

# PyPI's long description is README.md with its repository-relative links made absolute, so the one file renders
# on GitHub and on pypi.org. pypi.org has no dark theme and its sanitizer drops <source>: the light <img> stays.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# the README's HTML comment markers around the author blocks
pattern = '<!-- /?named -->\n'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '[ \t]*<source media="\(prefers-color-scheme: dark\)"[^>]*>\n'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# HTML images
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/dolev31/TabAgent/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Markdown images
pattern = '(!\[[^\]]*\])\((?!https?://)([^)\s]+)\)'
replacement = '\1(https://raw.githubusercontent.com/dolev31/TabAgent/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Markdown links to files in the repository (in-page #anchors keep working on PyPI)
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/dolev31/TabAgent/blob/main/\1)'

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # experiments/ is importable from tests without path edits
addopts = "-ra"
markers = [
  "slow: long-running regression tests (excluded from the default CI run)",
  "gpu: needs a CUDA GPU",
  "network: needs network access (dataset downloads, live LLM endpoints)",
]

[tool.ruff.lint.isort]
known-first-party = ["tabagent"]
known-local-folder = ["conftest"]
