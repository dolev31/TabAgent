  - Get started:
      - get-started/index.md
      - Installation: get-started/installation.md
      - Quickstart (5 minutes): get-started/quickstart.md
      - Onboard your agent: get-started/onboard-your-agent.md
      - Core concepts: get-started/core-concepts.md
  - Guides:
      - guides/index.md
      - Build a head:
          - Onboard from logs: guides/onboard-from-logs.md
          - Bring your own table: guides/bring-your-own-table.md
          - Choose and evaluate a head: guides/choose-and-evaluate-a-head.md
      - Check and debug:
          - Check and debug logs: guides/check-and-debug-logs.md
          - When onboarding goes wrong: guides/when-onboarding-goes-wrong.md
          - Verify the generated code: guides/verify-generated-code.md
      - Deploy:
          - Deploy and serve: guides/deploy-and-serve.md
          - Hot-swap into an agent: guides/hot-swap-into-an-agent.md
          - Production runbook: guides/production-runbook.md
  - Concepts:
      - concepts/index.md
      - The three phases: concepts/three-phases.md
      - Decision kinds: concepts/decision-kinds.md
      - Per-candidate features: concepts/per-candidate-features.md
      - Leakage safety: concepts/leakage-safety.md
      - The confidence gate: concepts/confidence-gate.md
  - API reference:
      - reference/index.md
      - Onboarding and heads: reference/onboarding.md
      - scikit-learn estimators: reference/estimators.md
      - Tables and cards: reference/tables.md
      - TabSchema, TabSynth, TabHead: reference/phases.md
      - Evaluation: reference/evaluation.md
      - Logs and adapters: reference/logs.md
      - Serving and integrations: reference/serving.md
      - Datasets: reference/datasets.md
      - Command line: reference/cli.md
  - Reproduce the paper:
      - Reproducing the paper: reproducing.md
      - Public datasets: datasets.md
  - Changelog: changelog.md
  - Project:
      - project/index.md
      - Citation: project/citation.md
      - Contributing: project/contributing.md
      - Wanted: project/wanted.md
      - Governance: project/governance.md
      - Security policy: project/security.md
      - Code of conduct: project/code-of-conduct.md
