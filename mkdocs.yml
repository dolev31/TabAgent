site_name: TabAgent
site_description: Replace an LLM agent's closed-set decisions with a cheap classifier trained on its own traces.
site_url: https://dolev31.github.io/TabAgent/
repo_url: https://github.com/dolev31/TabAgent
repo_name: TabAgent
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 The TabAgent authors. Code released under the Apache-2.0 license.

# Theme overrides live under docs/ but are templates, not pages. releasing.md is for maintainers (linked from
# CONTRIBUTING.md), not part of the site.
exclude_docs: |
  /overrides/
  /hooks/
  /releasing.md
  /_pages/

# Built and searchable by link, but kept out of the navigation: the source of every number on the README and the
# landing page.
not_in_nav: |
  /claims-map.md
  /podcast/transcript.md

hooks:
  - docs/hooks/faq.py
  - docs/hooks/media.py
  - docs/hooks/release.py
  - docs/hooks/page_header.py
  - docs/hooks/project_files.py
  - docs/hooks/cli_reference.py
  - docs/hooks/redirect_anchors.py
  - docs/hooks/llms_check.py

# Fonts are served from the site itself: the privacy plugin downloads Inter and JetBrains Mono (SIL OFL 1.1) from
# Google Fonts at build time, so a visitor's browser never contacts Google. Nothing else external is fetched.
plugins:
  - search
  - privacy:
      assets_include:
        - fonts.googleapis.com/*
        - fonts.gstatic.com/*
  # The pages that moved when the guides were split: each old address forwards to its new page. The anchors of
  # the old pages are forwarded to the page that now holds them (docs/hooks/redirect_anchors.py).
  - redirects:
      redirect_maps:
        onboarding.md: guides/onboard-from-logs.md
        deployment.md: guides/deploy-and-serve.md
        components.md: concepts/three-phases.md
        bring_your_own_data.md: guides/bring-your-own-table.md
  # The API reference is generated from the docstrings (NumPy style; docs/hooks/numpy_params.py reads the
  # package's `name: description` parameter lists).
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - docs/hooks/numpy_params.py
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_root_toc_entry: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
            line_length: 100

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/brand/tabagent-mark.svg
  favicon: assets/brand/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline
  # Inter and JetBrains Mono load in docs/overrides/main.html (variable weights 400-800), self-hosted by `privacy`.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - announce.dismiss
    - announce.dismiss

extra_css:
  - stylesheets/extra.css

# Search-engine verification and the visitor counter. docs/overrides/main.html emits each tag only when its code is
# set here, so the site carries none of them until then.
extra:
  # The paper's PDF beside the page, fetched from arXiv by the Pages workflow (Google Scholar attaches a PDF only
  # from the page's own directory). The workflow drops the citation_pdf_url tag if the fetch fails.
  paper_pdf: paper.pdf
#   google_site_verification: TOKEN   # Google Search Console, URL-prefix property, HTML-tag method
#   bing_site_verification: TOKEN     # Bing Webmaster Tools, meta-tag method (msvalidate.01)
  goatcounter: tabagent              # GoatCounter site code (tabagent.goatcounter.com): counts visits without cookies
  # The explainer video on the landing page. The Pages workflow downloads the MP4, WebM and VTT from the GitHub
  # Release media-v1 into docs/assets/video/ (git-ignored; docs/releasing.md). docs/hooks/media.py plays them only
  # when the MP4 is there at build time; otherwise the page shows the animated pipeline.
  explainer_video: assets/video/tabagent-explainer.mp4
  explainer_poster: assets/explainer-poster.webp
  # The podcast episode (an M4A from the same release, also downloaded by the Pages workflow; the landing page
  # shows its section only when the file is there). Its cover is committed under docs/assets/podcast/.
  podcast_audio: assets/video/tabagent-podcast.m4a

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

