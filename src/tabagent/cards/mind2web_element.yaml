card_version: 1
name: mind2web_element
decision:
  kind: ranking
  group: task_uid
  label: is_target
  candidate: backend_node_id
  decision:
  - task_uid
  - step_index
  eval:
  - eval_operation
  - eval_op_value
  - eval_original_op
features:
- name: instruction
  family: state
  type: text
  description: task instruction (confirmed_task)
- name: website
  family: state
  type: cat
- name: domain
  family: state
  type: cat
  description: 'web domain: Entertainment, Shopping or Travel'
- name: subdomain
  family: state
  type: cat
- name: step_index
  family: state
  type: num
  description: equal to n_prior_actions; both were features of the paper runs
- name: n_prior_actions
  family: state
  type: num
  args:
    col: step_index
  description: actions taken before this step
- name: history_action_reprs
  family: state
  type: text
  description: representations of the earlier actions of the task, ' | '-joined
- name: elem_tag
  family: schema
  type: cat
  description: HTML tag of the candidate element
- name: elem_attr_text
  family: schema
  type: text
  description: identifying attributes (class, id, name, role, aria/alt/title, placeholder, value, label, type)
- name: elem_type
  family: schema
  type: cat
  description: type attribute
- name: elem_is_clickable
  family: schema
  type: num
- name: elem_x
  family: schema
  type: num
  description: bounding box on the pre-action page
- name: elem_y
  family: schema
  type: num
- name: elem_w
  family: schema
  type: num
- name: elem_h
  family: schema
  type: num
- name: elem_area
  family: schema
  type: num
  source: python:tabagent.datasets.mind2web:box_area
  args:
    w: elem_w
    h: elem_h
synth:
  text_cols:
  - instruction
  k: 2
provenance:
  kind: hand-authored
  ported_from: pre-release Mind2Web adapter (columns of the paper runs)
  paper: Table 1
