card_version: 1
name: skillsbench_skill_select_noprior
decision:
  kind: ranking
  group: task_uid
  label: relevant
  candidate: skill_name
features:
- name: task_text
  family: state
  type: text
  description: the task instruction (task.md)
- name: skill_name
  family: schema
  type: cat
- name: skill_desc
  family: schema
  type: text
  description: first 800 characters of the skill's SKILL.md
- name: skill_name_len
  family: schema
  type: num
  source: word_count
  args:
    col: skill_name
- name: skill_task_overlap
  family: dependency
  type: num
  source: fitted:embedding_cosine
  args:
    query: task_text
    passage: skill_desc
    encoder: e5-small-v2
- name: skill_task_lex_overlap
  family: schema
  type: num
  source: jaccard
  args:
    a: task_text
    b:
    - skill_name
    - skill_desc
synth:
  text_cols:
  - task_text
  k: 2
provenance:
  kind: frozen
  paper: Table 1 (skill selection); App. M, Table 20
  note: >-
    The task instruction, the skill's name and SKILL.md opening, and task-skill lexical and embedding
    similarity (the embedding centering fitted inside the training folds). With CatBoost (paper preset), the
    pinned folds and the paper's seeds it gives P@R 0.796 (App. M, Table 20).
