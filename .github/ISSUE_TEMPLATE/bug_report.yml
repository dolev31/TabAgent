name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A command or a short script. Do not paste private trajectories or API keys.
      render: python
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: "`python --version`, `pip show tabagent catboost pandas scikit-learn`, operating system and CPU."
      render: text
    validations:
      required: true
