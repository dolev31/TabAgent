name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Nothing is published while the repository is private; the site goes live once it is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The explainer video from a GitHub Release (the landing page shows the pipeline while there is none)
        # The MP4, WebM and VTT are too large to commit (docs/releasing.md). The newest release tagged media-v*
        # that has the MP4 wins, else any release that has it; docs/hooks/media.py plays the video only if the MP4
        # is there at build time.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            [.[] | select(.draft | not) | select(any(.assets[]; .name == "tabagent-explainer.mp4"))]
            | (map(select(.tag_name | startswith("media-v"))) + .) | .[0].tag_name // empty') || tag=""
          if [ -z "$tag" ]; then
            echo "No release has tabagent-explainer.mp4: the landing page shows the pipeline."
            exit 0
          fi
          mkdir -p docs/assets/video
          for f in tabagent-explainer.mp4 tabagent-explainer.webm tabagent-explainer.vtt; do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$f" -D docs/assets/video --clobber \
              || { rm -f "docs/assets/video/$f"; echo "$f: not downloaded from $tag"; }
          done
          ls -l docs/assets/video
      - run: uv run --group docs mkdocs build --strict
      - name: The README's high-resolution teaser (1280 px, too large to commit) from the media release
        # The README's hero loads site/assets/explainer-teaser-hd.webp; without it, the committed 720 px teaser
        # (docs/assets/explainer-teaser.webp) is what the site serves under that name.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download media-v1 -R "$GITHUB_REPOSITORY" -p explainer-teaser-hd.webp -D site/assets --clobber \
            || cp docs/assets/explainer-teaser.webp site/assets/explainer-teaser-hd.webp
          ls -l site/assets/explainer-teaser-hd.webp
      - name: The paper's PDF beside the page (Google Scholar attaches a PDF only from the page's own directory)
        # Pinned to the version whose title the page carries; until it is listed, the Scholar PDF tag is dropped.
        run: |
          if curl -fsSL --retry 3 -o site/paper.pdf "https://arxiv.org/pdf/2602.16429v2"; then
            echo "paper.pdf: $(wc -c < site/paper.pdf) bytes"
          else
            rm -f site/paper.pdf
            sed -i '/name="citation_pdf_url"/d' site/index.html
            echo "arXiv v2 not listed yet: citation_pdf_url removed"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
