name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      # The TabSchema LLM clients (OpenAI and LiteLLM), so the provider tests run instead of skipping.
      - run: uv sync --group dev --extra tabschema --extra llm
      - run: uv run pytest -m "not slow and not gpu and not network"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The docs group holds mkdocs-material, mkdocstrings[python] (the API reference) and mkdocs-redirects.
      - run: uv sync --group docs
      - run: uv run --group docs mkdocs build --strict

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: bring-your-own-table example (offline, CPU)
        run: uv run python examples/02_bring_your_own_table.py
