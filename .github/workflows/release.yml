name: release
# Pushing a version tag (v0.1.0, v0.2.0rc1, ...) publishes that version to PyPI and creates its GitHub Release.
# Maintainer steps, including the one-time PyPI trusted-publisher setup: docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Nothing is published while the repository is private; the jobs below need this one and are skipped with it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/tabagent/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ = \"$version\" in src/tabagent/__init__.py"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tabagent/
    permissions:
      id-token: write  # PyPI Trusted Publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: GitHub Release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc|dev)[0-9]*$ ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "TabAgent ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
