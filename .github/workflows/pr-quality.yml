name: pr-quality
# Checks a pull request against the bar in CONTRIBUTING.md ("The bar") before a person reads it:
#   description  scripts/check_pr_body.py: every section of the pull request template is filled in, "Why" links the
#                issue it closes (the `no-issue` label waives it), "How it was tested" names the command in backticks,
#                "Evidence" is a result or says why no number can move, "Agent use" names who read every line, and
#                the checklist is ticked
#   gate         scripts/pr_gate.py on the lines the diff adds: docstrings and types on changed public API, a new
#                module's docstring, a test with every library change, 90% of the changed library lines covered, a
#                changelog line, every suppression with its reason, every TODO with its issue, at most 800 lines
#
# It runs again when the description is edited or a label changes, so fixing the description is enough to clear it.
# Drafts are skipped until they are marked ready for review. A maintainer waives one rule for one pull request with
# a label: `no-issue` (a small fix with no issue), `no-changelog` (nothing a user sees changed), `no-new-test`
# (a pure refactor), or `gate-waived: <gate>`.
# The workflow reads the pull request and the repository and writes nothing: it runs on `pull_request`, never
# `pull_request_target`, so a fork's code runs with a read-only token. Actions are pinned by commit SHA (the tag is
# in the trailing comment).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  description:
    name: The description meets the bar
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The description reaches the script only through the environment, never by expanding into the command line.
      - name: Check the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python scripts/check_pr_body.py --labels "$LABELS"

  gate:
    name: The diff meets the bar
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --group dev --extra tabschema --extra llm
      - name: Tests with coverage
        run: uv run pytest -m "not slow and not gpu and not network" --cov=src/tabagent --cov-report=xml -q
      - name: The contribution gate on this pull request's changes
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          waive=$(echo "$LABELS" | tr ',' '\n' | sed -n -e 's/^gate-waived: *//p' \
            -e 's/^no-changelog$/changelog/p' -e 's/^no-new-test$/tests/p' | paste -sd, -)
          uv run python scripts/pr_gate.py --base "origin/$BASE_REF" --coverage coverage.xml --waive "$waive"
